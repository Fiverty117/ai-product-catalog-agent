[project]
name = "ai-product-catalog-agent-backend"
version = "0.1.0"
description = "Backend for the AI Product Catalog Agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
  "openai>=3.13,<4",
  "babel>=2.16",
  "jinja2>=3.1",
  "playwright>=1.49",
  "pypdf>=5.0",
  "qrcode[pil]>=8.0,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
